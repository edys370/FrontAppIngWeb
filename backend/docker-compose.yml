services:
  # Microservicio Node.js Express
  products-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: products-api
    restart: unless-stopped
    environment:
      - PORT=3000
      - NODE_ENV=production
      - SERVICE_NAME=products-microservice
      - API_PREFIX=/api/v1
      - CORS_ORIGIN=*
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - microservices-network

  # Proxy inverso Caddy
  caddy:
    image: caddy:2-alpine
    container_name: caddy-proxy
    restart: unless-stopped
    environment:
      - UPSTREAM=products-api:3000
    ports:
      - "8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      products-api:
        condition: service_healthy
    networks:
      - microservices-network

networks:
  microservices-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
